name: Build AeroDock Windows Portable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    # windows-2022 includes Visual Studio 2022 (MSVC 17), required by Flutter 3.29.3
    runs-on: windows-2022

    defaults:
      run:
        working-directory: flutter_windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (3.29.3 stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop, init runner & apply custom .ico
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows --project-name aerodock .
          }
          if (Test-Path "test/widget_test.dart") {
            Remove-Item -Force "test/widget_test.dart"
          }
          if (Test-Path "assets/app_icon.ico") {
            Copy-Item -Force "assets/app_icon.ico" "windows/runner/resources/app_icon.ico"
          }

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows Release (.exe)
        run: flutter build windows --release

      - name: Package Portable ZIP (Settings.ini + Skins + Icons + Docklets + Languages)
        shell: pwsh
        run: |
          $out = "dist/AeroDock-Portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" "$out/"
          foreach ($dir in @("Skins", "Icons", "Docklets", "Languages")) {
            New-Item -ItemType Directory -Force -Path "$out/$dir" | Out-Null
          }
          if (Test-Path "Settings.ini") {
            Copy-Item -Force "Settings.ini" "$out/Settings.ini"
          }
          if (Test-Path "README-FLUTTER-RU.txt") {
            Copy-Item -Force "README-FLUTTER-RU.txt" "$out/README-RU.txt"
          }
          Compress-Archive -Path "$out/*" -DestinationPath "dist/AeroDock-Windows-Portable-x64.zip" -Force

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroDock-Windows-Portable-x64
          path: flutter_windows/dist/AeroDock-Windows-Portable-x64.zip
          retention-days: 30

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "dist/AeroDock-Windows-Portable-x64.zip" `
            --title "AeroDock Portable $tag" `
            --notes "Портативная сборка AeroDock v3.0 (Flutter + Native Win32 FFI, 1-3 панели, Settings.ini, Доклеты, Скины, Сворачивание окон). Распакуйте и запустите aerodock.exe."
