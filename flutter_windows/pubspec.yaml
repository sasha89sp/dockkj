name: aerodock
description: Портативная док-панель для Windows в стиле RocketDock на Flutter с поддержкой 1-3 панелей, доклетов, скинов и сворачивания окон.
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  window_manager: ^0.4.3
  flutter_acrylic: ^1.1.4
  screen_retriever: ^0.2.0
  tray_manager: ^0.2.4
  hotkey_manager: ^0.2.3
  desktop_drop: ^0.5.0
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
